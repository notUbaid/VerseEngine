<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERSE//ENGINE — Standalone Test & Verification Harness</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #060506;
      color: #FAF9F6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #harness-dock {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100005;
      background: rgba(14, 12, 16, 0.88);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 1px rgba(255, 255, 255, 0.2);
    }
    .harness-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #E03E52;
      text-transform: uppercase;
      padding-right: 4px;
    }
    .harness-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #FAF9F6;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .harness-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .harness-btn.active {
      background: #E03E52;
      border-color: #E03E52;
      color: white;
    }
    .harness-slider {
      width: 140px;
      cursor: pointer;
    }
    .harness-time {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      opacity: 0.8;
      min-width: 72px;
    }
  </style>
</head>
<body>
  <audio id="harness-audio" src="sample.wav" preload="auto"></audio>

  <div id="harness-dock">
    <span class="harness-title">VERSE//HARNESS</span>
    <button class="harness-btn active" id="btn-t1">1. Latin (Hip-Hop)</button>
    <button class="harness-btn" id="btn-t2">2. Hindi (Devanagari)</button>
    <button class="harness-btn" id="btn-t3">3. Japanese (CJK)</button>
    <button class="harness-btn" id="btn-play">▶ Play</button>
    <input type="range" id="seek-bar" class="harness-slider" min="0" max="30000" step="10" value="0">
    <span id="time-disp" class="harness-time">00:00 / 00:30</span>
    <button class="harness-btn" id="btn-hud">Shift+D: HUD</button>
    <button class="harness-btn" id="btn-stage">Stage</button>
  </div>

  <script>
    // ── HARNESS MOCK SPICETIFY ENVIRONMENT ───────────────────────────────────
    let sampleData = null;
    let currentTrackIdx = 0;
    const audioEl = document.getElementById('harness-audio');
    const playBtn = document.getElementById('btn-play');
    const seekBar = document.getElementById('seek-bar');
    const timeDisp = document.getElementById('time-disp');
    const listeners = {};

    let mockProgressMs = 0;
    let isPlaying = false;
    let lastAudioTick = performance.now();

    window.Spicetify = {
      CosmosAsync: {
        get: async (url) => {
          if (!sampleData) {
            try {
              const resp = await nativeFetch('sample-lyrics.json');
              sampleData = await resp.json();
            } catch {}
          }
          const cur = sampleData ? sampleData.tracks[currentTrackIdx] : null;
          if (!cur) return null;
          return {
            lyrics: {
              syncType: 'LINE_SYNCED',
              lines: cur.lines.map(l => ({
                startTimeMs: l.startMs.toString(),
                words: l.words.map(w => w.text).join(' ')
              }))
            }
          };
        }
      },
      Player: {
        data: {
          item: null,
          is_playing: false,
          progress: 0
        },
        getProgress: () => mockProgressMs,
        getDuration: () => {
          const cur = sampleData ? sampleData.tracks[currentTrackIdx] : null;
          return cur ? cur.durationMs : 30000;
        },
        isPlaying: () => isPlaying,
        play: () => {
          isPlaying = true;
          window.Spicetify.Player.data.is_playing = true;
          audioEl.play().catch(() => {});
          playBtn.textContent = '⏸ Pause';
          (listeners['onplaypause'] || []).forEach(cb => cb());
        },
        pause: () => {
          isPlaying = false;
          window.Spicetify.Player.data.is_playing = false;
          audioEl.pause();
          playBtn.textContent = '▶ Play';
          (listeners['onplaypause'] || []).forEach(cb => cb());
        },
        togglePlay: () => {
          if (isPlaying) window.Spicetify.Player.pause();
          else window.Spicetify.Player.play();
        },
        seek: (ms) => {
          const total = sampleData ? sampleData.tracks[currentTrackIdx].durationMs : 30000;
          mockProgressMs = Math.max(0, Math.min(ms, total));
          window.Spicetify.Player.data.progress = mockProgressMs;
          seekBar.value = mockProgressMs;
          updateTimeDisplay();
          (listeners['onprogress'] || []).forEach(cb => cb());
        },
        addEventListener: (event, cb) => {
          if (!listeners[event]) listeners[event] = [];
          listeners[event].push(cb);
        },
        removeEventListener: (event, cb) => {
          if (listeners[event]) {
            listeners[event] = listeners[event].filter(x => x !== cb);
          }
        }
      },
      Playbar: {
        Button: class {
          constructor(label, icon, onClick) {
            this.label = label;
            this.icon = icon;
            this.onClick = onClick;
            this.active = false;
          }
          register() {
            console.log('[Harness] Playbar button registered:', this.label);
          }
        }
      },
      Topbar: {
        Button: class {
          constructor(label, icon, onClick) {
            this.label = label;
            this.icon = icon;
            this.onClick = onClick;
          }
        }
      },
      getAudioData: async () => {
        // Mock Spicetify AudioAnalysis: 120 BPM beat grid
        const now = audioEl.currentTime;
        const beatInterval = 0.5; // 120 BPM
        const currentBeat = Math.floor(now / beatInterval);
        return {
          beats: [
            { start: currentBeat * beatInterval, duration: beatInterval, confidence: 0.95 },
            { start: (currentBeat + 1) * beatInterval, duration: beatInterval, confidence: 0.95 }
          ],
          bars: [
            { start: Math.floor(now / 2.0) * 2.0, duration: 2.0, confidence: 0.9 }
          ],
          sections: [
            { start: 0, duration: 30, loudness: -6.5, tempo: 120, key: 5, mode: 1 }
          ],
          track: {
            tempo: 120,
            loudness: -6.5
          }
        };
      },
      showNotification: (msg) => console.log('[Spicetify Notice]', msg)
    };

    function updateTimeDisplay() {
      const s = Math.floor(mockProgressMs / 1000);
      const totalS = Math.floor(sampleData ? sampleData.tracks[currentTrackIdx].durationMs / 1000 : 30);
      const mStr = Math.floor(s / 60).toString().padStart(2, '0');
      const sStr = (s % 60).toString().padStart(2, '0');
      const tmStr = Math.floor(totalS / 60).toString().padStart(2, '0');
      const tsStr = (totalS % 60).toString().padStart(2, '0');
      timeDisp.textContent = `${mStr}:${sStr} / ${tmStr}:${tsStr}`;
    }

    function harnessTick() {
      const now = performance.now();
      const dt = (now - lastAudioTick) / 1000;
      lastAudioTick = now;

      if (isPlaying) {
        const total = sampleData ? sampleData.tracks[currentTrackIdx].durationMs : 30000;
        mockProgressMs += dt * 1000;
        if (mockProgressMs > total) mockProgressMs = 0;
        window.Spicetify.Player.data.progress = mockProgressMs;
        seekBar.value = mockProgressMs;
        updateTimeDisplay();
      }

      requestAnimationFrame(harnessTick);
    }
    requestAnimationFrame(harnessTick);

    audioEl.addEventListener('play', () => {
      isPlaying = true;
      window.Spicetify.Player.data.is_playing = true;
      playBtn.textContent = '⏸ Pause';
      (listeners['onplaypause'] || []).forEach(cb => cb());
    });

    audioEl.addEventListener('pause', () => {
      isPlaying = false;
      window.Spicetify.Player.data.is_playing = false;
      playBtn.textContent = '▶ Play';
      (listeners['onplaypause'] || []).forEach(cb => cb());
    });

    // Mock fetch for LRCLIB & lyrics endpoint
    const nativeFetch = window.fetch.bind(window);
    window.fetch = async (url, opts) => {
      if (typeof url === 'string' && url.includes('sample-lyrics.json')) {
        return nativeFetch(url, opts);
      }
      if (!sampleData) {
        try {
          const resp = await nativeFetch('sample-lyrics.json');
          sampleData = await resp.json();
        } catch (e) {
          console.error('[Harness] Failed to load sample-lyrics.json:', e);
        }
      }
      const cur = sampleData ? sampleData.tracks[currentTrackIdx] : null;
      if (cur) {
        return {
          ok: true,
          json: async () => ({
            trackName: cur.name,
            artistName: cur.artist,
            duration: cur.durationMs / 1000,
            syncedLyrics: null, // Let provider use synthesized/AST lines
            lines: cur.lines
          })
        };
      }
      return nativeFetch(url, opts);
    };

    async function initHarness() {
      const resp = await fetch('sample-lyrics.json');
      sampleData = await resp.json();
      selectTrack(0);
    }

    function selectTrack(idx) {
      if (!sampleData) return;
      currentTrackIdx = idx;
      const track = sampleData.tracks[idx];
      audioEl.currentTime = 0;
      seekBar.value = 0;
      seekBar.max = track.durationMs;

      window.Spicetify.Player.data.item = {
        uri: track.uri,
        name: track.name,
        artists: [{ name: track.artist, uri: `spotify:artist:${track.artist}` }],
        album: {
          name: track.album,
          images: [{ url: track.albumArtUrl }]
        },
        duration: { milliseconds: track.durationMs }
      };

      document.getElementById('btn-t1').classList.toggle('active', idx === 0);
      document.getElementById('btn-t2').classList.toggle('active', idx === 1);
      document.getElementById('btn-t3').classList.toggle('active', idx === 2);

      (listeners['songchange'] || []).forEach(cb => cb());
    }

    document.getElementById('btn-t1').onclick = () => selectTrack(0);
    document.getElementById('btn-t2').onclick = () => selectTrack(1);
    document.getElementById('btn-t3').onclick = () => selectTrack(2);
    playBtn.onclick = () => window.Spicetify.Player.togglePlay();
    seekBar.oninput = (e) => window.Spicetify.Player.seek(parseFloat(e.target.value));
    document.getElementById('btn-hud').onclick = () => {
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'D', shiftKey: true }));
    };
    document.getElementById('btn-stage').onclick = () => {
      if (window.VerseEngine) window.VerseEngine.toggleStage();
    };

    window.addEventListener('DOMContentLoaded', initHarness);
  </script>

  <!-- Load VerseEngine production bundle -->
  <script src="../dist/verse-engine.js"></script>

  <script>
    // Automatically trigger stage after harness loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (window.VerseEngine && !window.VerseEngine.isOpen) {
          window.VerseEngine.openStage();
        }
      }, 600);
    });
  </script>
</body>
</html>
